{% extends "base.html" %}
{% block title %}Register - InsightBot{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <img class="auth-icon" src="/static/img/icon-128.png" alt="InsightBot">
    <h1>Create an account</h1>
    <p class="auth-sub">An admin will need to approve your account before you can log in.</p>
    <form id="register-form">
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <label>Password (min 8 characters)<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
      <button type="submit">Register</button>
    </form>
    <p id="register-message" class="message"></p>
    <p>Already approved? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/register.js"></script>{% endblock %}
