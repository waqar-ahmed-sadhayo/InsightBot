{% extends "base.html" %}
{% block title %}Register - InsightBot{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm bg-surface-container-lowest dark:bg-[#1e293b] border border-outline-variant dark:border-[#334155] rounded-xl shadow-sm p-8 text-center">
    <img class="w-14 h-14 rounded-xl mx-auto mb-4" src="/static/img/icon-128.png" alt="InsightBot">
    <h1 class="font-headline-md text-headline-md font-bold text-on-surface dark:text-[#f8fafc]">Create an account</h1>
    <p class="font-body-md text-body-md text-on-surface-variant dark:text-[#94a3b8] mt-1 mb-6">An admin will need to approve your account before you can log in.</p>
    <form id="register-form" class="space-y-4 text-start">
      <label class="block">
        <span class="font-label-md text-label-md text-on-surface-variant dark:text-[#94a3b8]">Email</span>
        <input type="email" name="email" autocomplete="email" required
          class="mt-1 w-full h-11 px-3 bg-surface dark:bg-[#1e293b] border border-outline-variant dark:border-[#334155] rounded-lg text-body-md text-on-surface dark:text-[#f8fafc] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
      </label>
      <label class="block">
        <span class="font-label-md text-label-md text-on-surface-variant dark:text-[#94a3b8]">Password (min 8 characters)</span>
        <div class="relative mt-1">
          <input type="password" name="password" id="register-password" minlength="8" autocomplete="new-password" required
            class="w-full h-11 px-3 pe-11 bg-surface dark:bg-[#1e293b] border border-outline-variant dark:border-[#334155] rounded-lg text-body-md text-on-surface dark:text-[#f8fafc] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
          <button type="button" id="toggle-password-btn" class="absolute end-2 top-1/2 -translate-y-1/2 text-on-surface-variant dark:text-[#94a3b8] hover:text-on-surface dark:hover:text-[#f8fafc] rounded-full p-1.5 transition-colors" aria-label="Show password" title="Show password">
            <span class="material-symbols-outlined text-[20px]" aria-hidden="true">visibility</span>
          </button>
        </div>
      </label>
      <button type="submit" class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg shadow-sm hover:shadow-md transition-shadow">Register</button>
    </form>
    <p id="register-message" class="font-body-md text-body-md mt-4"></p>
    <p class="font-body-md text-body-md text-on-surface-variant dark:text-[#94a3b8] mt-4">Already approved? <a href="/login" class="text-primary dark:text-primary-fixed-dim hover:underline">Log in</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/register.js"></script>{% endblock %}
