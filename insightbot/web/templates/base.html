<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InsightBot{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    (function () {
      var saved = localStorage.getItem("insightbot_theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/">
        <img class="brand-mark" src="/static/img/icon-128.png" alt="InsightBot">
        <span class="brand-name">InsightBot</span>
      </a>
      <nav class="sidebar-nav">
        <a href="/" class="sidebar-link" data-path="/">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1.2" stroke="currentColor" stroke-width="2"/><rect x="3" y="10" width="18" height="4" rx="1.2" stroke="currentColor" stroke-width="2"/><rect x="3" y="16" width="18" height="4" rx="1.2" stroke="currentColor" stroke-width="2"/></svg>
          <span>Articles</span>
        </a>
        <a href="/?saved=true" class="sidebar-link" data-path="/?saved=true" data-auth-only>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 6-5.2-2.8-5.2 2.8 1-6-4.3-4.2 5.9-.8L12 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Saved</span>
        </a>
        <a href="/admin" class="sidebar-link" data-path="/admin" data-admin-only>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Admin</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="/login" class="sidebar-link" data-guest-only>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Log in</span>
        </a>
      </div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <button id="sidebar-toggle" class="icon-btn sidebar-toggle-btn" type="button" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <nav class="topnav">
          <div class="control select-wrap">
            <svg class="select-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M4 12h16M12 4c2.4 2.4 3.3 5.3 3.3 8s-.9 5.6-3.3 8c-2.4-2.4-3.3-5.3-3.3-8s.9-5.6 3.3-8z" stroke="currentColor" stroke-width="1.8"/></svg>
            <select id="lang-toggle" title="Filter by language">
              <option value="">All languages</option>
              <option value="en">English</option>
              <option value="ar">Arabic</option>
              <option value="ru">Russian</option>
            </select>
          </div>
          <div class="control search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="search-box" type="search" placeholder="Search articles...">
          </div>
          <span class="topnav-divider" aria-hidden="true"></span>
          <button id="theme-toggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <span id="auth-area"></span>
        </nav>
      </header>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
