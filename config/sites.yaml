# InsightBot site configuration
#
# Populated with real, live article URLs pulled from public RSS feeds on
# 2026-08-17 (see the discovery approach in README.md). News URLs age out
# quickly -- if a URL 404s later, swap in a fresh article from the same
# outlet's RSS feed; the domain is what matters for the generic-heuristic
# generalization story, not the specific article.
#
# training  - sites used to derive/tune any per-domain overrides in
#             extraction_rules.yaml (currently none are needed -- the
#             generic heuristic handles all of these).
# held_out  - different domains from training, never used to tune rules;
#             insightbot/evaluation/evaluate.py measures accuracy here to
#             show the heuristic generalizes rather than overfits.

